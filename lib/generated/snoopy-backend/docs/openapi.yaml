        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [workspaces]
      operationId: requestProjectAccess
      description: >-
        Asks to join a team the person is not on. No body: the person is the
        session's, the team is the path's. Someone who can already see the team has
