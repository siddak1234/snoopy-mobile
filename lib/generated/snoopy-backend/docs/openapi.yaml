openapi: 3.1.1
info:
  title: Snoopy Backend API
  version: 0.2.0
  description: >-
    Client contract for the Snoopy website and future mobile app. Health and
    website OAuth identity, Access-backed session, workspace, and project tenancy
    paths are implemented in code; production readiness still requires deployed/configured dependencies. Product data and artifact
    paths consumed by Snoopy are authenticated, explicit fail-closed contracts
    until their owning service adapters are implemented. Other product paths
    remain design placeholders. The maintained detailed public surfaces live in
    `docs/openapi/access.yaml`, `automations.yaml`, and `connections.yaml`; those
    fragments are authoritative for their named domains while this root document
    retains the legacy cross-domain index and billing callback.
  x-status: draft
x-service-id: edge-api
servers:
  - url: https://api.example.invalid
    description: Placeholder; deployment domain is not selected.
tags:
  - name: health
  - name: session
  - name: login-identity
  - name: workspaces
  - name: automations
  - name: connections
  - name: runs
  - name: approvals
  - name: billing
security:
  - websiteSession: []
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveHealth
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveHealthResponse'
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Configured dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more adapters are not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/session:
    get:
      tags: [session]
      operationId: getSession
      responses:
        '200':
          description: Authenticated session and workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/NotConfigured'
        '502':
          description: The private Access dependency failed or violated its contract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /v1/auth/providers:
    get:
      tags: [login-identity]
      operationId: listLoginProviders
      security: []
      responses:
        '200':
          description: OAuth-only login provider policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginProvidersResponse'
  /v1/auth/oauth/{provider}/start:
    get:
      tags: [login-identity]
      operationId: startLoginOAuth
      security: []
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
        - name: return_to
          in: query
          schema: { type: string, default: /account }
      responses:
        '302':
          description: Redirect to the provider through Supabase Auth; sets signed PKCE state.
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/oauth/callback:
    get:
      tags: [login-identity]
      operationId: completeLoginOAuth
      security: []
      description: >-
        Where Supabase returns every sign-in and link transaction. Success sets
        first-party HttpOnly session cookies and redirects to a validated website
        path, or — for a native transaction — to the app's redirect URI with a
        one-time `code`. A failure redirects to the website's
        `/login?error=auth_callback&reason=<reason>`, or to the app's redirect URI
        with `status=error&reason=<reason>`. `reason` is one token from a fixed
        list, never provider text: `identity_already_linked` (the account picked
        belongs to another sign-in — Supabase's `identity_already_exists`),
        `access_denied` (declined at the provider, RFC 6749 §4.1.2.1),
        `linking_disabled` (`manual_linking_disabled`), `provider_disabled`
        (`provider_disabled`, `oauth_provider_not_supported`), `signup_disabled`,
        `account_disabled` (`user_banned`), `email_unverified`
        (`provider_email_needs_verification`, `email_not_confirmed`),
        `provider_refused` (any other Supabase or OAuth error), `missing_code` (no
        code and no error), `exchange_failed` (the code could not be exchanged),
        and `outside_org_domain` (a website link refused because the account's
        address is outside a domain-only organization's verified domains — the
        account was unlinked again). Every Location carries an explicit fragment,
        empty unless the destination has its own, so the browser never carries
        Supabase's `#error=…` fragment over (RFC 9110 §10.2.2).
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: An OAuth error from Supabase or the provider. Never echoed.
          schema: { type: string }
        - name: error_code
          in: query
          description: Supabase's machine-readable refusal code. Never echoed.
          schema: { type: string }
        - name: error_description
          in: query
          description: Supabase's free-text description. Ignored and never echoed.
          schema: { type: string }
      responses:
        '302':
          description: >-
            Signed in, linked, or refused — see the operation's description for
            the destinations and the `reason` tokens.
  /v1/auth/identities:
    get:
      tags: [login-identity]
      operationId: listLoginIdentities
      responses:
        '200':
          description: Linked login identities; contains no provider tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdentitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/identities/{provider}:
    delete:
      tags: [login-identity]
      operationId: unlinkLoginIdentity
      description: >-
        Removes a linked sign-in account from the website's session (BUILD-PLAN
        24.11.1). The account the person signed up with (`primary`) and the last one
        left are refused, so there is always a way to sign in; a 400's `detail` is a
        sentence a client shows as it is. A native client, whose refresh token travels
        in a body, calls `/v1/auth/native/identities/{provider}/unlink`.
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
      responses:
        '200':
          description: What stays linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdentitiesResponse'
        '400':
          # BadRequest — see the shared response for the problem shape.
          description: >-
            The primary account, the last account, or one the provider will not
            remove; `details.reason` is `primary`, `last` or `refused`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: That provider is not linked to this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/identities/{provider}/start:
    get:
      tags: [login-identity]
      operationId: startLoginIdentityLink
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
        - name: return_to
          in: query
          schema: { type: string, default: /account/settings }
      responses:
        '302':
          description: Redirect to link an additional login identity.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/native/{provider}/start:
    get:
      tags: [login-identity]
      operationId: startNativeLogin
      security: []
      description: >-
        Begins a native login (ADR-0017). The same transaction and the same
        `AUTH_CALLBACK_URL` as the website; only the ending differs. The caller opens
        this in a system browser, which carries the OAuth transaction cookie for it —
        the app never reads that cookie. `redirect_uri` must match an entry in
        `NATIVE_APP_REDIRECT_URIS` exactly, and must be an app-claimed HTTPS URL:
        ADR-0008 rejects custom schemes, which any app on a device can register.
        `code_challenge` is the app's OWN PKCE pair, independent of the provider
        transaction's, and is what binds the resulting one-time code to this device.
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          required: true
          description: Base64url SHA-256 of the verifier; exactly 43 characters.
          schema: { type: string, minLength: 43, maxLength: 43 }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
      responses:
        '302':
          description: >-
            Redirect to the provider through Supabase Auth; sets signed PKCE state
            carrying the native redirect target. The callback later redirects to
            `redirect_uri` with a one-time `code`, or with `status=error` and a reason.
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/native/token:
    post:
      tags: [login-identity]
      operationId: exchangeNativeSession
      security: []
      description: >-
        Trades the one-time code for a session. The code is single-use because it
        carries an unredeemed provider authorization code, which the provider itself
        refuses to redeem twice. A forged, tampered, expired, replayed, or
        wrong-verifier code are all one 401 — distinguishing them would tell a holder
        of a captured code which it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier]
              properties:
                code: { type: string }
                codeVerifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: A session for a native client. Never set as a cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          # Unauthenticated — see the shared response for the problem shape.
          description: >-
            The credential is dead — forged, tampered, expired, already spent, or
            presented with the wrong verifier. One answer for all of them, because
            telling them apart only helps someone probing a code they should not
            have. A client receiving this discards its stored session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: >-
            The code ended a link, and the account it added was refused because its
            address is outside the verified domains of a domain-only organization
            the person belongs to (decision 8B); `details.reason` is
            `outside_org_domain`. The account was unlinked again and the session
            the link minted was signed out. **Keep the stored session**: it is the
            one the link started from, and it is still good.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '502':
          # DependencyFailure — see the shared response for the problem shape.
          description: >-
            The identity provider could not be reached. **Retry; do not discard the
            session.** Distinct from 401 on purpose: a client that treats an outage
            as a dead credential signs out every user who happened to open the app
            during it. A link whose domain-only check could not be made was undone
            and also answers 502.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/native/refresh:
    post:
      tags: [login-identity]
      operationId: refreshNativeSession
      security: []
      description: Renews a native session without a second consent screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: A replacement session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          # Unauthenticated — see the shared response for the problem shape.
          description: The refresh token is dead. Sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '502':
          # DependencyFailure — see the shared response for the problem shape.
          description: Provider unreachable. Retry; do not discard the session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/native/identities/{provider}/ticket:
    post:
      tags: [login-identity]
      operationId: startNativeIdentityLink
      security:
        - bearerAuth: []
      description: >-
        A native client links another sign-in account (ADR-0017 §6). The same link
        transaction the website starts at `/v1/auth/identities/{provider}/start`, for
        the person the bearer names. A browser cannot carry that bearer, so the
        transaction comes back SEALED — a ticket the app opens once, in its own system
        browser, at `/v1/auth/native/identities/{provider}/start`. From the provider
        onwards it is login's native flow: the callback returns a one-time `code` to
        `redirectUri`, traded with the app's verifier at `/v1/auth/native/token` for a
        session that now carries the linked identity. The refresh token travels here
        as it does to `/v1/auth/native/refresh` and never in a URL. An access token
        at or near its expiry is refused with 401 rather than refreshed here, which
        would rotate the refresh token the device holds.
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken, redirectUri, codeChallenge]
              properties:
                refreshToken: { type: string }
                redirectUri:
                  type: string
                  format: uri
                  description: An exact entry of `NATIVE_APP_REDIRECT_URIS`, as for login.
                codeChallenge:
                  type: string
                  minLength: 43
                  maxLength: 43
                  description: Base64url SHA-256 of the app's own verifier (S256).
      responses:
        '200':
          description: The sealed ticket, and how long it stays usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeIdentityLinkTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          # Unauthenticated — see the shared response for the problem shape.
          description: >-
            No bearer, a refused session, or an access token too close to expiry.
            Renew once and retry; a second 401 is a dead session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '502':
          # DependencyFailure — see the shared response for the problem shape.
          description: The identity provider could not start linking. Retry; keep the session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/native/identities/{provider}/unlink:
    post:
      tags: [login-identity]
      operationId: unlinkNativeIdentity
      security:
        - bearerAuth: []
      description: >-
        A native client removes a linked sign-in account (BUILD-PLAN 24.11.1): the
        website's `DELETE /v1/auth/identities/{provider}` for the person the bearer
        names, with the refresh token in the body as at `/v1/auth/native/refresh`.
        The same refusals, with the same sentences: the account the person signed up
        with and the last one left stay linked. An access token at or near its expiry
        is refused with 401 rather than refreshed here, which would rotate the refresh
        token the device holds.
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: What stays linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginIdentitiesResponse'
        '400':
          # BadRequest — see the shared response for the problem shape.
          description: >-
            The primary account, the last account, or one the provider will not
            remove (`details.reason` is `primary`, `last` or `refused`); or a body
            without `refreshToken`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          # Unauthenticated — see the shared response for the problem shape.
          description: >-
            No bearer, a refused session, or an access token too close to expiry.
            Renew once and retry; a second 401 is a dead session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '404':
          description: That provider is not linked to this account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '502':
          $ref: '#/components/responses/DependencyFailure'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/native/identities/{provider}/start:
    get:
      tags: [login-identity]
      operationId: openNativeIdentityLink
      security: []
      description: >-
        The browser leg of a native link (ADR-0017 §6). Opened in the app's system
        browser on the same origin as `AUTH_CALLBACK_URL`: sets the OAuth transaction
        cookie login's start sets, then redirects to the provider. The ticket is
        AES-256-GCM under its own derived key, lives two minutes, and names its
        provider; a forged, tampered, expired or mismatched one is one 400.
      parameters:
        - $ref: '#/components/parameters/LoginProvider'
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: >-
            Redirect to the provider through Supabase Auth, with the signed PKCE state
            set. The callback later redirects to the ticket's `redirectUri` with a
            one-time `code`, or with `status=error` and a reason.
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/NotConfigured'
  /v1/auth/logout:
    post:
      tags: [login-identity]
      operationId: logout
      description: >-
        Ends a session. The website sends no body and its cookies are cleared. A
        native client sends its `refreshToken` and a bearer access token, which is
        what actually revokes the session upstream — without them there is nothing to
        revoke and the token in the device keychain would stay live.
      requestBody:
        required: false
        description: >-
          Omitted entirely by the website, whose session is in cookies. **Required
          when the request carries a bearer token**: a native caller with no
          `refreshToken` is refused with 400 rather than answered 204, because a 204
          would have the device delete a keychain entry for a session that is still
          live upstream.
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: >-
            Cookies cleared, and any supplied refresh token revoked — or already
            invalid, which is the same outcome for the caller.
        '400':
          # BadRequest — see the shared response for the problem shape.
          description: A bearer token was presented without a readable `refreshToken`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          # DependencyFailure — see the shared response for the problem shape.
          description: >-
            The provider could not be reached, so the session was NOT revoked. Retry
            before discarding stored tokens.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /v1/contact-requests:
    post:
      tags: [login-identity]
      operationId: submitContactRequest
      description: >-
        The marketing site's contact form (BUILD-PLAN Phase 7 item 7.5). The third
        and last unauthenticated public route: the sender has no account, so there
        is no session to check. Standing in for authentication are the form's spam
        honeypot, validation bounded to the column widths Access enforces, and the
        Edge rate limiter. No cookie is read, so there is no ambient authority to
        forge and same-origin is deliberately not required.

        The form also posts a `company` field. It is a HONEYPOT, hidden from people
        and omitted here on purpose: a submission that fills it is discarded and
        answered with a receipt indistinguishable from a real one, because a 400
        would teach a bot which field to leave alone next time. Do not add it to a
        generated client, and do not populate it.

        `maxLength` counts CHARACTERS, matching the columns. The request body is
        separately capped at 8192 BYTES, so a submission in a multi-byte script
        reaches the byte cap first — the documented maxima are an upper bound, not
        a reachable budget.


        Since S1-12 (§12.1 #36) a recorded enquiry is emailed once to the
        deployment's contact address, `Reply-To` the sender, with each stored
        field that has a value. Best effort: the answer is 201 whether or not the
        email went, since the stored row is the record; a trapped submission
        sends nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 320 }
                industry: { type: string, maxLength: 200 }
                workflow: { type: string, maxLength: 2000 }
                tools: { type: string, maxLength: 500 }
                volume: { type: string, maxLength: 200 }
                success: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: The enquiry was recorded. Carries a receipt, never an echo of the body.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contactRequestId, receivedAt]
                properties:
                  contactRequestId: { type: string, format: uuid }
                  receivedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/flow-email/confirm:
    get:
      tags: [automations]
      operationId: readFlowEmailConfirmation
      description: >-
        S1-7 (§12.1 #289): the confirm link in a new extra address's ONE
        confirmation email. Public, like the contact form: the person has no
        account; the token, which only the Catalog signs and checks, names one
        address of one flow, and the Edge rate limiter is in front. A GET changes
        nothing (a mail scanner that follows it confirms nothing): it answers a
        page, "Confirm emails from {flow}" with a "Confirm" button that POSTs back
        to this link — or "You'll get emails from {flow}." once confirmed, "You
        won't get emails from {flow} anymore." once stopped. 404, a page with no
        sentence, for a link that names nothing.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowEmailToken'
      responses:
        '200':
          $ref: '#/components/responses/FlowEmailPage'
        '404':
          $ref: '#/components/responses/FlowEmailPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [automations]
      operationId: confirmFlowEmail
      description: >-
        S1-7: the "Confirm" press. A `pending` address becomes `confirmed` and
        gets the flow's run emails from then on: "You'll get emails from {flow}."
        A stopped address stays stopped, whatever an old confirm link says. 404
        for a link that names nothing.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowEmailToken'
      responses:
        '200':
          $ref: '#/components/responses/FlowEmailPage'
        '404':
          $ref: '#/components/responses/FlowEmailPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/flow-email/stop:
    get:
      tags: [automations]
      operationId: readFlowEmailStop
      description: >-
        S1-7 (§12.1 #289): the stop link in every email to a flow's extra address
        — its footer's "Stop these emails" and its `List-Unsubscribe`. A GET
        changes nothing: it answers a page with a "Stop these emails" button that
        POSTs back to this link, or "You won't get emails from {flow} anymore."
        once stopped. 404 for a link that names nothing.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowEmailToken'
      responses:
        '200':
          $ref: '#/components/responses/FlowEmailPage'
        '404':
          $ref: '#/components/responses/FlowEmailPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [automations]
      operationId: stopFlowEmail
      description: >-
        S1-7: the press, and RFC 8058's one-click unsubscribe — a mail app POSTs
        `List-Unsubscribe=One-Click` here, as the email's `List-Unsubscribe-Post`
        header says; the body is not read. The address is `stopped`, from any
        status, and gets nothing more: "You won't get emails from {flow} anymore."
        404 for a link that names nothing.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowEmailToken'
      responses:
        '200':
          $ref: '#/components/responses/FlowEmailPage'
        '404':
          $ref: '#/components/responses/FlowEmailPage'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/account:
    delete:
      tags: [session]
      operationId: deleteAccount
      description: >-
        A customer leaving (FR-21). Deletion spans five schemas as one auditable
        operation; the actor comes from the session and there is no id in the path,
        so a caller cannot name an account that is not theirs.

        **The sign-in identity goes too (S1-10, §12.1 #248).** After the rows are
        purged, Access deletes the person's sign-in identity, and every device is
        signed out: the Edge's sign-out has scope `global`. A native client should
        send its `refreshToken`, so the Edge can revoke that session. The body is
        optional because a DELETE conventionally carries none: omitting it deletes
        the account and skips revocation rather than refusing after the rows are
        already gone. The website needs nothing — its cookies are cleared, which is
        itself effective.


        **503** before anything is removed when Access holds no
        `SUPABASE_SECRET_KEY` (Access's `NOT_CONFIGURED`, which the Edge relays as
        `DEPENDENCY_FAILURE`). **502 `DEPENDENCY_FAILURE`** when the identity
        delete fails after the purge: the rows are gone and no device has been
        signed out, and a retry reaches the delete again.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: >-
            Deleted. The body reports what was removed per service — `deleted: true`
            is the only outcome that means the whole operation committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          # A partial deletion, relayed as 409 rather than 200 so a client doing
          # `if (response.ok)` cannot tell a customer their data is gone while some
          # of it remains. **The same `application/json` result as 200, not a
          # problem document** — §12.1 #164: it is the Access result the Edge
          # relays, and it says which workspaces a service could not remove.
          description: >-
            The deletion did not complete across every service. `deleted` is
            false, `reason` says why, and each workspace reports its services.
            Nothing after the refusing service was attempted, so a retry resumes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionResult' }
        '502':
          # Two outcomes, two codes — §12.1 #167.
          description: >-
            **`SESSION_REVOCATION_FAILED` — bearer callers only.** The account was
            deleted, but the identity provider could not be reached to revoke the
            refresh token the caller sent. The device still holds a live
            credential; retry the revocation through `POST /v1/auth/logout`. A
            cookie caller never receives it: its cookies are cleared, which is
            itself effective. **`DEPENDENCY_FAILURE` — any caller.** The Edge could
            not complete its call to the service that deletes, so whether anything
            was removed is unknown; read `GET /v1/session` before telling a person
            either way. It also answers a sign-in identity delete that failed
            after the purge (S1-10): the rows are gone and the identity remains,
            so retry `DELETE /v1/account`, which reaches the delete again, rather
            than reading `GET /v1/session`, which would make a new account.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/export:
    get:
      tags: [workspaces]
      operationId: exportWorkspace
      description: >-
        Everything this workspace owns, as records and references (BUILD-PLAN
        7.4). Requires owner or admin. **The response carries IDs and references,
        never file bytes** — each artifact is named with its size and digest, and
        fetched separately through a short-lived signed URL.

        `complete: false` means this is a partial export. That is true when a
        service cannot answer and also when any successful nested service section
        has `data.truncated: true`; success from every service alone is not a
        completeness guarantee. This response does not emit pagination cursors:
        a workspace larger than one bounded section takes EVERYTHING through
        `startWorkspaceExport`, which stages the whole workspace in one or more
        files, each a whole JSON document that opens alone (§12.1 #39, #181).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace's records, per service; may be partial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workspaces/{workspaceId}/exports:
    post:
      tags: [workspaces]
      operationId: startWorkspaceExport
      description: >-
        **A complete export** (§12.1 #39, FR-21). Requires owner or admin.
        Answers at once with the export `running`; read it with
        `readWorkspaceExport` until it is `ready`, when it carries its files —
        each an artifact id and a short-lived signed URL, never the bytes
        (invariant 6).


        Every section of every service is paged, so no section is cut at 250 rows
        as the bounded `exportWorkspace` is. A run's `output` is not in it, nor in
        the run detail (SYSTEM-MANIFEST §12.1 #67 keeps it unpublished; the
        per-flow export of BUILD-PLAN Phase 26 is its planned first shape). A
        service that cannot answer makes the file partial
        (`complete: false`, and the file names the gap) rather than absent.


        **In parts (§12.1 #181).** The export is uploaded in bounded parts, each
        within the object store's maximum for one file (25 MiB unless the
        deployment sets less), so no single upload grows with the workspace;
        `ready` carries every part, in order, in `files` ("Download file {n} of
        {N}"). Each part is a whole JSON document that opens alone, split
        between records and sections, never inside one, with its own header:
        `part`, `parts`, `workspaceId` and `exportedAt`. At most 20
        parts: an export past that fails `too_large`, as soon as it passes it
        rather than after reading everything. `file` is sent only when the
        export is one file, for clients built before `files`; an export of
        several carries `files` alone, and reads `expired` once any part is
        collected.


        One at a time per workspace: while one is running, asking again answers
        that one. The file is collected a day after it is made, after which the
        export reads `expired` and a new one may be asked for. Deleting the
        workspace withdraws a running export (`workspace_deleted`) and no file is
        made for it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The export, running (or the one already running).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExportJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/workspaces/{workspaceId}/exports/{exportId}:
    get:
      tags: [workspaces]
      operationId: readWorkspaceExport
      description: >-
        One export's state. `running` until the job ends; then `ready` with its
        `files` (and `file` when it is one), or `failed` with a `failureReason` (`interrupted` when nothing
        finished it within its lease); `expired` once the file is collected.
        Requires owner or admin. Each read signs a fresh URL, valid for minutes.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The export, and its file when ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExportJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agreements/health-data:
    get:
      tags: [workspaces]
      operationId: getHealthDataAgreement
      description: >-
        ADR-0049 (C3): the current health data agreement (a Business Associate
        Agreement), for any signed-in person to read before an owner accepts it.
        503 `agreement_not_published` while a lawyer has not approved one — then
        every health flow's turn-on and run start is refused `agreement_required`.
      responses:
        '200':
          description: The text to scroll, its version and its sha256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDataAgreement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/agreements:
    post:
      tags: [workspaces]
      operationId: acceptAgreement
      description: >-
        ADR-0049 (C3): the workspace's owner accepts the health data agreement it
        read (`AgreementAcceptanceRequest`). Owner only, from the membership — an
        admin or a member is 403 with `details.requiredRole: owner`; a version or
        sha256 that is not the current text's is 409 `agreement_changed`; 503
        `agreement_not_published` while none is published. One append-only row
        with the signed copy; a second acceptance is a second row. Cookie callers
        are held to the website's origin.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgreementAcceptanceRequest' }
      responses:
        '201':
          description: The signed document, as `{document}`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/WorkspaceDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/agreements/health-data:
    get:
      tags: [workspaces]
      operationId: readWorkspaceHealthDataAgreement
      description: >-
        ADR-0049 Amendment 2: what the setup's "Contract and accept" step shows —
        the current health data agreement's version and sha256 (`current`, null
        while none is published: 200, not 503) and the workspace's newest
        acceptance of exactly that version and text (`acceptance`, null when
        none; an acceptance of an older version or another text never counts).
        Owner or admin only, a member is 403, as the Documents list (ADR-0049
        amendment 1); a workspace not the session's is 404.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The current version and the workspace's acceptance of it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceHealthDataAgreement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/documents:
    get:
      tags: [workspaces]
      operationId: listWorkspaceDocuments
      description: >-
        ADR-0049 (C3): the workspace's signed documents, newest first, at most 50,
        one query. Owner or admin only, a member is 403 (ADR-0049 amendment 1).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The Documents list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDocumentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/documents/{documentId}:
    get:
      tags: [workspaces]
      operationId: readWorkspaceDocument
      description: >-
        ADR-0049 (C3): one signed document with its copy, as `{document}`; read
        only when its row is opened. Owner or admin only, a member is 403, for an
        unknown id too; another workspace's is 404.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The document and its signed copy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/WorkspaceDocumentCopy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DependencyFailure' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /v1/workspaces/{workspaceId}/members:
    get:
      tags: [workspaces]
      operationId: listWorkspaceMembers
      description: Who is in this workspace (BUILD-PLAN 4.6.2). Any member may read it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Bounded keyset page of workspace members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workspaces/{workspaceId}/members/{userId}:
    delete:
      tags: [workspaces]
      operationId: removeWorkspaceMember
      description: >-
        Removes an organization member. Owners or admins may remove a member;
        only an owner may remove an owner, and an organization must retain an
        owner. This is not an invite or admission mechanism.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Whether the membership was removed; false is an idempotent absence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/workspaces/{workspaceId}:
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      description: >-
        Renames an organization workspace, turns its domain-only setting on or off
        (decision 8B), or both — at least one of `name` and `domainOnly`. Owners
        and admins only; actor authority comes from the session. A personal
        workspace is 404. Turning `domainOnly` on is refused unless the
        organization has a verified domain and every current member's every
        sign-in address is at one; nothing and nobody is removed because of it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' }
      responses:
        '200':
          description: Workspace after the idempotent change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The idempotency key was reused with different input, or `domainOnly`
            could not be turned on: `details.reason` is `no_verified_domain` (the
            organization has no verified domain) or `members_outside_domain` with
            `details.count`, how many current members have a sign-in address
            outside the verified domains. A member whose sign-ins the platform has
            not seen since this setting shipped counts as outside until their next
            sign-in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /v1/workspaces/{workspaceId}/projects/{projectId}:
    get:
      tags: [workspaces]
      operationId: readProject
      description: >-
        One team — a project in this contract (BUILD-PLAN 4.6.1; the vocabulary is
        24.11.5). A workspace member who is not on the team gets 404, so the
        refusal does not reveal that it exists; an owner or admin of the
        organization sees every team.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project, with the role this actor holds on it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [workspaces]
      operationId: updateProject
      description: >-
        Rename, re-describe, or archive. Archive is a status change, not a delete,
        so the project keeps its runs, grants and audit trail. `description: null`
        clears the field; omitting it leaves it alone. A body naming no field is
        refused rather than burning an idempotency key on a change nobody made.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMutationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          # Conflict — see the shared response for the problem shape.
          description: >-
            Restoring an archived team onto a kind another team now holds:
            `details.reason` is `team_kind_taken` and `detail` is "This workspace
            already has a department of this kind" (BUILD-PLAN 24.12.1). An idempotency
            key reused with different input is the other conflict, and carries no
            reason.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /v1/workspaces/{workspaceId}/projects/{projectId}/memberships:
