        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/workspaces/{workspaceId}/projects/{projectId}/access-requests:
    get:
      tags: [workspaces]
      operationId: listProjectAccessRequests
      description: >-
        Who is asking to join this team (a project in this contract; BUILD-PLAN
        24.11.2). A manager of the team — `owner` or `admin`, which an owner or admin
