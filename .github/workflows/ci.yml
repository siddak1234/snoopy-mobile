name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on main (the owner's go 2026-11-01, NIGHT-7): the same jobs on an
  # unchanged main, so a moved runner image, registry or contract shows the
  # morning after, not at the next PR. A release reads only the push run's
  # all-green (scripts/all-green-on-head.mjs), so this run never counts there.
  schedule:
    - cron: '32 9 * * *'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # A trial (CI plan Wave 2 [A]), on this job only because it is the critical
      # path: the installed tree, keyed on the exact lockfile. An exact hit skips
      # `npm ci` (12-20 s of this job over the five-run baseline); no restore-keys,
      # so any other lockfile misses, runs `npm ci` as before and never reads a
      # stale tree. Nothing the tests write lands in the tree: jest's cache is the
      # runner's tmpdir (no cacheDirectory is set). The key carries the OS because
      # the tree's prebuilt binaries (lightningcss, the unrs resolver) are chosen
      # per OS and arch; they are N-API, so the Node version is not part of it.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # The suite as `npm run verify` runs it, one command for both. `--runInBand`:
      # without it CI ran the suite in a different concurrency mode from every
      # Gate 8 run, so a flake could appear in exactly one of the two places and
      # neither would reproduce the other. `--ci` makes a missing snapshot a
      # failure instead of writing one, which is what keeps the visual gate a
      # gate. The coverage is istanbul's function counts, in coverage/, for the
      # press audit that follows.
      - run: npm run test:coverage
      # No silent skips (M4): a skipped, todo or `.only`-shadowed test is red,
      # read from the JSON report test:coverage writes beside the coverage.
      - run: node scripts/no-skipped-tests.mjs
      # Every press is run by a test (build 13: "Ensure auditing of all
      # functionality that buttons and items work as we have configured"): each
      # onPress resolved to the function it runs, and that function's count read
      # from the coverage above. A press no test pressed fails the build.
      - run: npm run audit:presses

  gates:
    name: Architecture gates
    runs-on: ubuntu-24.04
    # The docs checks read the PR's whole range against its base, so the
    # checkout keeps every commit and the base is named (the backend's
    # engineering standard, section (e)).
    env:
      DOCS_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A code change without the doc docs/docs-map.json maps it to, a commit
      # trailer `Docs-Unchanged: <reason>` excepted (scripts/kit/check-docs.mjs).
      - run: npm run check:docs
      # docs/MAP.md is generated from the map and the tree; stale is red.
      - run: npm run map -- --check
      # No document names a file that does not exist (scripts/audit-doc-references.mjs).
      - run: npm run audit:docs
      # The prototype shipped a hardcoded demo email and plaintext password in
      # the auth screens. They are gone and the allowlist is empty; the ratchet
      # now holds the count at zero, and a new occurrence fails the build.
      - run: npm run audit:credentials
      # Colour belongs in constants/theme.ts. The design system ships an oxlint
      # adherence config saying so, but nothing runs it — `expo lint` does not.
      # This is the gate that makes the rule real.
      - run: npm run audit:tokens
      # Every font size is a step of the type scale in constants/theme.ts — the
      # owner's bigger type (24.12) — so a screen cannot drift back to the
      # design's small sizes, and tuning the type stays one table.
      - run: npm run audit:type
      # Every padding, margin and gap is a name from the platform's spacing
      # table (backend ADR-0048 amendment 1, point 14; the owner's Q8), so the
      # same gap cannot be 0, 9 or 14 from screen to screen again (build 30, F3).
      - run: npm run audit:spacing
      # A person reads Teams and Flows; the contract's "project" and "automation"
      # stay in the code. A renamed screen could keep an old sentence (24.11.7).
      - run: npm run audit:vocabulary
      # Every press ticks through components/pressable.tsx (build 11, D7): a
      # Pressable drawn from react-native, expo-haptics called elsewhere, or a
      # Text's own onPress would be a silent press again.
      - run: npm run audit:haptics
      # Gate 8's first mobile line is "0 imports of lib/fixtures outside tests".
      # It was re-derived by hand with git grep in every audit; this is the
      # ratchet. The set may shrink and may never grow, and a file that stops
      # reading fixtures must leave the ledger in the same commit.
      - run: npm run audit:fixtures
      # Three more gate lines that were manual greps: one hand-written fetch
      # would fork the transport, one AsyncStorage import would break the
      # invariant ADR-0017 amended, and one console call could log a token
      # (one is admitted: components/blocks/not-drawn.ts, a part not drawn).
      - run: npm run audit:platform
      # Fail the build on critical advisories. High-severity findings that only
      # Expo 57 resolves remain a documented SDK migration rather than a forced
      # major upgrade inside Round 6.
      - run: npm run audit:dependencies
      # No backend checkout here: reads the committed, hash-checked copy
      # (lib/generated/snoopy-backend/, SHA256SUMS) and never skips (M1).
      - run: npm run verify:platform-contracts
      - name: No salvaged client data
        run: |
          # `_salvage/` lives in the workspace folder, outside every repository. It
          # holds the recovered n8n workflows and the legacy database archive: real
          # customer email addresses, vendor names, and dollar amounts. This
          # repository is public and git history is permanent, so deleting such a
          # file in a later commit does not remove it — the only workable control is
          # to never let it land.
          if git ls-files | grep -i '_salvage'; then
            echo "FAIL: a _salvage path is tracked in this repository."
            exit 1
          fi
          # Excludes .github/workflows: this file necessarily names the identifiers
          # it searches for.
          if git grep -Iln -iE 'gideontoal|clarossolutions' -- . ':(exclude).github/workflows/*'; then
            echo "FAIL: a real client identifier appears in tracked content."
            exit 1
          fi
          echo "No salvaged client data: PASS"

  export:
    name: Native bundle export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run export:ios
      - run: npm run export:android

  # The committed platform types against the contract the RUNNING platform
  # serves: each generated file's sha256 header must equal the hash the public
  # GET https://api.autom8x.ai/health/live reports for its document (the
  # platform's deployed marker). Fails closed — an unreachable host or an
  # answer with no marker is red, never a skip; platform-requirement.json is
  # the one reviewed escape for a change that must land ahead of the platform
  # (scripts/verify-deployed-contracts.mjs). Node's own fetch and no
  # dependency, so no install; no secret.
  contract-deployed:
    name: Deployed contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/verify-deployed-contracts.mjs

  # The one check a merge and a release read. Green only when EVERY job above
  # concluded success: a failure, a cancellation or a skip is red, because this
  # workflow has no job that is allowed to skip. The native export was never a
  # required check on its own; through this job it is.
  all-green:
    name: all-green
    if: always()
    needs: [lint, typecheck, test, gates, export, contract-deployed]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # issues: write for the nightly's report below, nothing else.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_success=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$not_success" ]; then
            echo "all-green: FAIL — not success: $(echo "$not_success" | tr '\n' ' ')"
            exit 1
          fi
          echo "all-green: every job succeeded"
      # A red nightly leaves an open "Nightly red" issue (one, commented on
      # each further red night), not only GitHub's email (NIGHT-9).
      - name: A red nightly reports itself
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly red"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'Nightly red' --body "$RUN"
          fi
