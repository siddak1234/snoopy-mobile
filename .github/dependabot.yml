# Version updates, weekly and grouped into one PR per ecosystem (the owner's
# choice 2026-11-01): the SHA pins in .github/workflows (each with its
# `# vX.Y.Z` comment, which Dependabot rewrites with the SHA) and the npm
# lockfile, eas-cli's exact pin included. Security alerts and fixes are on in
# the repository settings already. The kit's check-docs lets a Dependabot
# commit that touches only these files through without a doc change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      everything:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      everything:
        patterns: ['*']
