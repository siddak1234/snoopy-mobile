# Version updates for the actions, weekly (the owner's choice 2026-11-01): the
# SHA pins in .github/workflows, each with its `# vX.Y.Z` comment, which
# Dependabot rewrites with the SHA, in one grouped pull request. No npm
# version updates: the app's dependency bumps are each a round of their own
# (SYSTEM-MANIFEST §12.1 #278), and Expo's SDK set moves together. Security
# alerts and fixes for npm are on in the repository settings. The kit's
# check-docs lets a Dependabot commit that touches only these files through
# without a doc change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      everything:
        patterns: ['*']
